name: Mod Framework Build

on:
  push:
    branches:
      - feature/lua-mod-framework
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux GNU RelWithDebInfo
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Get CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
        with:
          cmakeVersion: latest

      - name: Configure, build and test
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          workflowPreset: linux-gnu-relwithdebinfo

      - name: Verify WorldServer and bundled mod
        shell: bash
        run: |
          test -x build/gnu-relwithdebinfo/WorldServer
          test -f build/gnu-relwithdebinfo/mods/DebugWorld.dlumod
